<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Chain</title>

  <!-- PWA: iOS 添加到主屏幕支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Chain" />
  <meta name="theme-color" content="#ebe6dc" />
  <!-- 图标：米色底 + 朱红圆 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23ebe6dc'/%3E%3Ccircle cx='90' cy='90' r='58' fill='%23e8452c'/%3E%3Ccircle cx='112' cy='112' r='20' fill='%23151515'/%3E%3C/svg%3E" />
  <!-- PWA Manifest (inline) -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Daily+Chain%22%2C%22short_name%22%3A%22Daily+Chain%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ebe6dc%22%2C%22theme_color%22%3A%22%23ebe6dc%22%2C%22start_url%22%3A%22.%22%7D" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <!-- 提前设置主题，避免闪烁 -->
  <script>(function(){var t='light';try{t=localStorage.getItem('dc_theme2')||'light';}catch(e){}document.documentElement.dataset.theme=t;})();</script>
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>

<!-- ════ PALETTE BACKDROP ════ -->
<div id="backdrop" onclick="closePalette()"></div>

<!-- ════ PALETTE DRAWER ════ -->
<div id="palDrawer">
  <div class="sheet-head">
    <div class="sheet-title" data-i18n="pal.title"></div>
    <button class="icon-btn" onclick="closePalette()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div class="pal-body">
    <div class="pal-sec" data-i18n="pal.hint"></div>
    <div id="paletteGrid" class="pal-grid"></div>
    <div class="pal-sec" data-i18n="pal.custom"></div>
    <div id="customGrid" class="pal-grid"></div>
    <button class="pal-add-btn" onclick="openCustomModal()" data-i18n="pal.new"></button>
  </div>
</div>

<!-- ════ MAIN VIEW ════ -->
<div class="main-view">
  <header class="topbar">
    <button class="date-badge" id="dateBadge" onclick="openCalendar()" data-i18n-aria="aria.calendar"></button>
    <div class="top-actions">
      <button class="icon-btn" onclick="openToday()" data-i18n-aria="aria.today" data-icon="calendar"></button>
      <button class="icon-btn" onclick="openMenu()" data-i18n-aria="aria.menu" data-icon="more"></button>
    </div>
  </header>
  <h1 class="greeting" id="greeting"></h1>
  <div class="progress-rail" id="progressRail"></div>
  <div id="startDay"></div>
  <div id="chainList"></div>
</div>

<!-- ════ EDIT MODE BAR ════ -->
<div id="editBar">
  <span data-i18n="edit.bar"></span>
  <button onclick="toggleEditMode()" data-i18n="edit.done"></button>
</div>

<!-- ════ MENU ════ -->
<div id="menuModal" class="modal-overlay hidden">
  <div class="modal-box menu-box">
    <button class="menu-item" onclick="menuAction('insert')"><span class="mi-icon">＋</span><span data-i18n="menu.insert"></span></button>
    <button class="menu-item" onclick="menuAction('edit')"><span class="mi-icon">✎</span><span data-i18n="menu.edit"></span></button>
    <button class="menu-item" onclick="menuAction('bedtime')"><span class="mi-icon">☾</span><span data-i18n="menu.bedtime"></span></button>
    <button class="menu-item" onclick="menuAction('theme')"><span class="mi-icon">◐</span><span id="themeLabel"></span></button>
    <button class="menu-item" onclick="menuAction('lang')"><span class="mi-icon">文</span><span data-i18n="menu.lang"></span></button>
    <button class="menu-item danger" onclick="menuAction('reset')"><span class="mi-icon">↺</span><span data-i18n="menu.reset"></span></button>
  </div>
</div>

<!-- ════ DIALOG (confirm / prompt) ════ -->
<div id="dialogModal" class="modal-overlay hidden">
  <div class="modal-box" id="dialogBox"></div>
</div>

<!-- ════ CUSTOM EVENT MODAL ════ -->
<div id="customModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title" data-i18n="cm.title"></div>
    <div class="modal-field">
      <label data-i18n="cm.icon"></label>
      <div class="glyph-picker" id="cg"></div>
    </div>
    <div class="modal-field">
      <label data-i18n="cm.name"></label>
      <input id="ct" type="text" data-i18n-ph="cm.name.ph">
    </div>
    <div class="modal-field">
      <label data-i18n="cm.step"></label>
      <input id="cs" type="text" data-i18n-ph="cm.step.ph">
    </div>
    <div class="modal-field">
      <label data-i18n="cm.cat"></label>
      <select id="ccat"></select>
    </div>
    <div class="modal-field">
      <label data-i18n="cm.btn"></label>
      <input id="cl" type="text" data-i18n-ph="cm.btn.ph">
    </div>
    <div class="modal-note" data-i18n="cm.note"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveCustomTemplate()" data-i18n="cm.save"></button>
      <button class="btn-ghost" onclick="closeCustomModal()" data-i18n="cancel"></button>
    </div>
  </div>
</div>

<!-- ════ BEDTIME OVERLAY ════ -->
<div id="bedtimeView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker" data-i18n="bed.kicker"></div>
    <button class="icon-btn" onclick="closeBedtime()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div class="page-title" data-i18n="bed.title"></div>
  <div class="page-sub" data-i18n="bed.sub"></div>
  <div class="sec-label" data-i18n="bed.bag"></div>
  <div id="nightChecklist"></div>
  <div class="sec-label" data-i18n="bed.first"></div>
  <div class="input-group">
    <div class="input-label"><span data-glyph="book"></span><span data-i18n="bed.study"></span></div>
    <textarea class="ni" id="studyFirst" rows="2" data-i18n-ph="bed.study.ph"></textarea>
  </div>
  <div class="input-group">
    <div class="input-label"><span data-glyph="laptop"></span><span data-i18n="bed.work"></span></div>
    <textarea class="ni" id="workFirst" rows="2" data-i18n-ph="bed.work.ph"></textarea>
  </div>
  <button class="btn-primary wide" onclick="saveBedtime()" data-i18n="bed.save"></button>
  <button class="btn-ghost wide" onclick="closeBedtime()" data-i18n="bed.back"></button>
</div>

<!-- ════ REST SHEET ════ -->
<div id="restSheet"></div>

<!-- ════ SWAP MODAL ════ -->
<div id="swapModal" class="modal-overlay hidden"><div class="modal-box"></div></div>

<!-- ════ TOAST ════ -->
<div id="toast"></div>

<!-- ════ CALENDAR OVERLAY ════ -->
<div id="calendarView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker" data-i18n="cal.kicker"></div>
    <button class="icon-btn" onclick="closeCalendar()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div id="calendarBody"></div>
</div>

<!-- ════ HISTORY OVERLAY ════ -->
<div id="historyView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker" data-i18n="log.kicker"></div>
    <button class="icon-btn" onclick="closeHistory()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div id="historyBody"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
