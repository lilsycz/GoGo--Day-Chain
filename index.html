<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Chain</title>

  <!-- PWA: iOS 添加到主屏幕支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Chain" />
  <meta name="theme-color" content="#ebe6dc" />
  <!-- 图标：米色底 + 朱红圆 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23ebe6dc'/%3E%3Ccircle cx='90' cy='90' r='58' fill='%23e8452c'/%3E%3Ccircle cx='112' cy='112' r='20' fill='%23151515'/%3E%3C/svg%3E" />
  <!-- PWA Manifest (inline) -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Daily+Chain%22%2C%22short_name%22%3A%22Daily+Chain%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ebe6dc%22%2C%22theme_color%22%3A%22%23ebe6dc%22%2C%22start_url%22%3A%22.%22%7D" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <!-- 提前设置主题，避免闪烁 -->
  <script>(function(){var t='light';try{t=localStorage.getItem('dc_theme2')||'light';}catch(e){}document.documentElement.dataset.theme=t;})();</script>
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>

<!-- ════ PALETTE BACKDROP ════ -->
<div id="backdrop" onclick="closePalette()"></div>

<!-- ════ PALETTE DRAWER ════ -->
<div id="palDrawer">
  <div class="sheet-head">
    <div class="sheet-title">插入一件事</div>
    <button class="icon-btn" onclick="closePalette()" aria-label="关闭" data-icon="close"></button>
  </div>
  <div class="pal-body">
    <div class="pal-sec">只加在今天，接在当前这件后面</div>
    <div id="paletteGrid" class="pal-grid"></div>
    <div class="pal-sec">自定义</div>
    <div id="customGrid" class="pal-grid"></div>
    <button class="pal-add-btn" onclick="openCustomModal()">＋ 新建事件</button>
  </div>
</div>

<!-- ════ MAIN VIEW ════ -->
<div class="main-view">
  <header class="topbar">
    <button class="date-badge" id="dateBadge" onclick="openCalendar()" aria-label="日历"></button>
    <div class="top-actions">
      <button class="icon-btn" onclick="openHistory()" aria-label="记录" data-icon="calendar"></button>
      <button class="icon-btn" onclick="openMenu()" aria-label="菜单" data-icon="more"></button>
    </div>
  </header>
  <h1 class="greeting" id="greeting"></h1>
  <div class="progress-rail" id="progressRail"></div>
  <div id="startDay"></div>
  <div id="chainList"></div>
</div>

<!-- ════ EDIT MODE BAR ════ -->
<div id="editBar">
  <span>编辑中 · 点文字改，拖 ≡ 排序</span>
  <button onclick="toggleEditMode()">完成</button>
</div>

<!-- ════ MENU ════ -->
<div id="menuModal" class="modal-overlay hidden">
  <div class="modal-box menu-box">
    <button class="menu-item" onclick="menuAction('insert')"><span class="mi-icon">＋</span>插入一件事</button>
    <button class="menu-item" onclick="menuAction('edit')"><span class="mi-icon">✎</span>编辑任务</button>
    <button class="menu-item" onclick="menuAction('bedtime')"><span class="mi-icon">☾</span>睡前清单</button>
    <button class="menu-item" onclick="menuAction('theme')"><span class="mi-icon">◐</span><span id="themeLabel">深色模式</span></button>
    <button class="menu-item danger" onclick="menuAction('reset')"><span class="mi-icon">↺</span>重置今天</button>
  </div>
</div>

<!-- ════ DIALOG (confirm / prompt) ════ -->
<div id="dialogModal" class="modal-overlay hidden">
  <div class="modal-box" id="dialogBox"></div>
</div>

<!-- ════ CUSTOM EVENT MODAL ════ -->
<div id="customModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">新建事件</div>
    <div class="modal-field">
      <label>图标</label>
      <div class="glyph-picker" id="cg"></div>
    </div>
    <div class="modal-field">
      <label>名称</label>
      <input id="ct" type="text" placeholder="事件名称">
    </div>
    <div class="modal-field">
      <label>第一步（可选）</label>
      <input id="cs" type="text" placeholder="比如：把琴拿出来">
    </div>
    <div class="modal-field">
      <label>类别（决定颜色）</label>
      <select id="ccat"></select>
    </div>
    <div class="modal-field">
      <label>完成后的按钮文字</label>
      <input id="cl" type="text" placeholder="完成了">
    </div>
    <div class="modal-note">自动保存在本设备，无需登录。</div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveCustomTemplate()">保存到调板</button>
      <button class="btn-ghost" onclick="closeCustomModal()">取消</button>
    </div>
  </div>
</div>

<!-- ════ BEDTIME OVERLAY ════ -->
<div id="bedtimeView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker">睡前清单</div>
    <button class="icon-btn" onclick="closeBedtime()" aria-label="关闭" data-icon="close"></button>
  </div>
  <div class="page-title">准备明天</div>
  <div class="page-sub">整理好，明天醒来直接出发</div>
  <div class="sec-label">背包确认</div>
  <div id="nightChecklist"></div>
  <div class="sec-label">明天的第一件事</div>
  <div class="input-group">
    <div class="input-label"><span data-glyph="book"></span>学习</div>
    <textarea class="ni" id="studyFirst" rows="2" placeholder="打开 xx 课程，继续第 x 课…"></textarea>
  </div>
  <div class="input-group">
    <div class="input-label"><span data-glyph="laptop"></span>工作</div>
    <textarea class="ni" id="workFirst" rows="2" placeholder="打开 xx，继续做 xx…"></textarea>
  </div>
  <button class="btn-primary wide" onclick="saveBedtime()">保存 · 明天见</button>
  <button class="btn-ghost wide" onclick="closeBedtime()">← 返回今日</button>
</div>

<!-- ════ REST SHEET ════ -->
<div id="restSheet"></div>

<!-- ════ SWAP MODAL ════ -->
<div id="swapModal" class="modal-overlay hidden"><div class="modal-box"></div></div>

<!-- ════ TOAST ════ -->
<div id="toast"></div>

<!-- ════ CALENDAR OVERLAY ════ -->
<div id="calendarView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker">日历</div>
    <button class="icon-btn" onclick="closeCalendar()" aria-label="关闭" data-icon="close"></button>
  </div>
  <div id="calendarBody"></div>
</div>

<!-- ════ HISTORY OVERLAY ════ -->
<div id="historyView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker">记录</div>
    <button class="icon-btn" onclick="closeHistory()" aria-label="关闭" data-icon="close"></button>
  </div>
  <div id="historyBody"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
