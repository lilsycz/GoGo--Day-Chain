<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Go Go Day</title>

  <!-- PWA: iOS 添加到主屏幕支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Go Go Day" />
  <meta name="theme-color" content="#ebe6dc" />
  <!-- 图标：朱红底，黑色长弧 + 钴蓝短弧（源文件在 icons/） -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <!-- 提前设置主题，避免闪烁 -->
  <script>(function(){var t='light';try{t=localStorage.getItem('dc_theme2')||'light';}catch(e){}document.documentElement.dataset.theme=t;})();</script>
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>

<!-- ════ INSERT TRAY（编辑模式底部，可上滑展开） ════ -->
<div id="palDrawer" data-state="closed">
  <div class="tray-head" id="trayHead">
    <div class="tray-grab"></div>
    <div class="tray-row">
      <div class="sheet-title"><span class="tray-plus" data-icon="plusFill"></span><span data-i18n="pal.title"></span></div>
      <span class="tray-chev" data-icon="chevUp"></span>
    </div>
  </div>
  <div class="pal-body">
    <div id="palSections"></div>
    <button class="pal-add-btn" onclick="openCustomModal()" data-i18n="pal.new"></button>
  </div>
</div>

<!-- ════ MAIN VIEW ════ -->
<div class="main-view">
  <header class="topbar">
    <button class="date-badge" id="dateBadge" onclick="openCalendar()" data-i18n-aria="aria.calendar"></button>
    <div class="top-actions">
      <button class="icon-btn edit-btn" id="editBtn" onclick="toggleEditMode()" data-i18n-aria="aria.edit"><span class="ic-edit" data-icon="editFill"></span><span class="ic-done" data-icon="check"></span></button>
      <button class="icon-btn" onclick="openToday()" data-i18n-aria="aria.today" data-icon="calendar"></button>
      <button class="icon-btn" onclick="openMenu()" data-i18n-aria="aria.menu" data-icon="more"></button>
    </div>
  </header>
  <h1 class="greeting" id="greeting"></h1>
  <div class="edit-head">
    <h1 class="greeting" data-i18n="edit.today"></h1>
  </div>
  <div class="progress-rail" id="progressRail"></div>
  <div id="startDay"></div>
  <div id="chainList"></div>
  <div id="editFooter"></div>
</div>

<!-- ════ MENU ════ -->
<div id="menuModal" class="modal-overlay hidden">
  <div class="modal-box menu-box">
    <button class="menu-item" onclick="menuAction('bedtime')"><span class="mi-icon" data-icon="moonFill"></span><span data-i18n="menu.bedtime"></span></button>
    <button class="menu-item" onclick="menuAction('theme')"><span class="mi-icon" data-icon="themeFill"></span><span id="themeLabel"></span></button>
    <button class="menu-item" onclick="menuAction('lang')"><span class="mi-icon" data-icon="langFill"></span><span data-i18n="menu.lang"></span></button>
    <button class="menu-item" onclick="menuAction('export')"><span class="mi-icon" data-icon="exportFill"></span><span data-i18n="menu.export"></span></button>
    <button class="menu-item" onclick="menuAction('import')"><span class="mi-icon" data-icon="importFill"></span><span data-i18n="menu.import"></span></button>
    <button class="menu-item danger" onclick="menuAction('reset')"><span class="mi-icon">↺</span><span data-i18n="menu.reset"></span></button>
  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<!-- ════ DIALOG (confirm / prompt) ════ -->
<div id="dialogModal" class="modal-overlay hidden">
  <div class="modal-box" id="dialogBox"></div>
</div>

<!-- ════ CUSTOM EVENT MODAL ════ -->
<div id="customModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title" data-i18n="cm.title"></div>
    <div class="modal-field">
      <input id="ct" type="text" data-i18n-ph="cm.name.ph" autocomplete="off">
    </div>
    <div class="modal-field">
      <div class="cat-picker" id="ccat"></div>
    </div>
    <div class="modal-field">
      <div class="glyph-picker" id="cg"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveCustomTemplate()" data-i18n="cm.save"></button>
      <button class="btn-ghost" onclick="closeCustomModal()" data-i18n="cancel"></button>
    </div>
  </div>
</div>

<!-- ════ BEDTIME OVERLAY ════ -->
<div id="bedtimeView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker" data-i18n="bed.kicker"></div>
    <button class="icon-btn" onclick="closeBedtime()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div class="page-title" data-i18n="bed.title"></div>
  <div id="bedBody"></div>
  <button class="btn-primary wide bed-done" onclick="closeBedtime()" data-i18n="bed.save"></button>
</div>

<!-- ════ REST SHEET ════ -->
<div id="restSheet"></div>

<!-- ════ STYLE PICKER ════ -->
<div id="styleModal" class="modal-overlay hidden"><div class="modal-box"></div></div>

<!-- ════ TEMPLATE SHEET ════ -->
<div id="tplModal" class="modal-overlay hidden"><div class="modal-box"></div></div>

<!-- ════ SWAP MODAL ════ -->
<div id="swapModal" class="modal-overlay hidden"><div class="modal-box"></div></div>

<!-- ════ TOAST ════ -->
<div id="toast"></div>

<!-- ════ CALENDAR OVERLAY ════ -->
<div id="calendarView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker" data-i18n="cal.kicker"></div>
    <button class="icon-btn" onclick="closeCalendar()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div id="calendarBody"></div>
</div>

<!-- ════ HISTORY OVERLAY ════ -->
<div id="historyView" class="page-overlay">
  <div class="page-head">
    <div class="page-kicker" data-i18n="log.kicker"></div>
    <button class="icon-btn" onclick="closeHistory()" data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div id="historyBody"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
